<article class="row">
    <div class="col-md-12">
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">Monitor Bulanan Sinkronisasi BPJS</h3>
            </div>
            <div class="panel-body">
                <form action="{?=url([ADMIN,'jkn_mobile','monitortaskid'])?}" method="POST" class="form-inline" style="margin-bottom: 20px;">
                    <div class="form-group">
                        <label for="bulan_antrol" style="margin-right: 10px;">Bulan:</label>
                        <input type="month" name="bulan_antrol" id="bulan_antrol" class="form-control" value="{$bulan_antrol}" required>
                    </div>
                    <div class="form-group" style="margin-left: 15px;">
                        <label for="kd_dokter" style="margin-right: 10px;">Dokter:</label>
                        <select class="form-control" name="kd_dokter" id="kd_dokter">
                            <option value="">Semua Dokter</option>
                            {loop: $dokter}
                            <option value="{$value.kd_dokter}" {if: $kd_dokter == $value.kd_dokter}selected{/if}>{$value.nm_dokter}</option>
                            {/loop}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary" style="margin-left: 15px;"><i class="fa fa-search"></i> Tampilkan</button>
                    <a href="{?=url([ADMIN,'jkn_mobile','taskid'])?}" class="btn btn-default pull-right"><i class="fa fa-arrow-left"></i> Kembali ke Task ID</a>
                </form>

                <div class="table-responsive">
                    <table class="table table-bordered table-hover">
                        <thead>
                            <tr>
                                <th class="text-center" width="5%">No</th>
                                <th class="text-center" width="20%">Tanggal</th>
                                <th class="text-center" width="20%">Total Pasien JKN</th>
                                <th class="text-center" width="20%">Pasien Tersinkron (Sukses)</th>
                                <th class="text-center" width="20%">Pasien Gagal/Pending</th>
                                <th class="text-center" width="15%">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            {loop: $rows}
                            <tr class="{if: $value.gagal > 0}warning{elseif: $value.total_jkn > 0 && $value.sukses > 0}success{/if}">
                                <td class="text-center">{?=$key+1?}</td>
                                <td class="text-center"><strong>{$value.tanggal}</strong></td>
                                <td class="text-center">
                                    <span class="badge" style="background-color: #337ab7;">{$value.total_jkn}</span>
                                </td>
                                <td class="text-center">
                                    <span class="badge" style="background-color: #5cb85c;">{$value.sukses}</span>
                                </td>
                                <td class="text-center">
                                    <span class="badge" style="background-color: {if: $value.gagal > 0}#d9534f{else}#777{/if};">{$value.gagal}</span>
                                </td>
                                <td class="text-center">
                                    <form action="{?=url([ADMIN,'jkn_mobile','taskid'])?}" method="POST" target="_blank" style="margin:0;">
                                        <input type="hidden" name="periode_antrol" value="{$value.tanggal}">
                                        <input type="hidden" name="kd_dokter" value="{$kd_dokter}">
                                        <input type="hidden" name="filter_jenis" value="bpjs">
                                        <button type="submit" class="btn btn-xs btn-info" title="Lihat detail pasien pada tanggal ini">
                                            <i class="fa fa-eye"></i> Detail
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            {/loop}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</article>
